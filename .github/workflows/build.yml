
name: Build SkrzynkaGracza

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Buduj plugin
        run: mvn clean package

      - name: Zapisz plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkrzynkaGracza
          path: target/*.jar
